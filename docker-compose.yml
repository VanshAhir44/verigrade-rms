services:
  postgres:
    image: postgres:16-alpine
    container_name: rms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-rms_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rms_user} -d ${POSTGRES_DB:-rms_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hardhat:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: rms_hardhat
    restart: unless-stopped
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "node", "-e", "const req=require('http').request({hostname:'localhost',port:8545,family:4,method:'POST',headers:{'Content-Type':'application/json'}},r=>process.exit(r.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.end(JSON.stringify({jsonrpc:'2.0',method:'eth_blockNumber',params:[],id:1}))"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rms_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rms_user}:${POSTGRES_PASSWORD:-change_me_strong_db_password}@postgres:5432/${POSTGRES_DB:-rms_db}
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      hardhat:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    container_name: rms_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
